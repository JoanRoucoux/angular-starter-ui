name: Generator check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Fetch starter-generator
        run: |
          git clone --depth 1 https://github.com/JoanRoucoux/starter-generator "$RUNNER_TEMP/starter-generator"
          pnpm install --frozen-lockfile --dir "$RUNNER_TEMP/starter-generator"

      - name: Generate a project from this working tree
        run: node "$RUNNER_TEMP/starter-generator/index.mjs" "$RUNNER_TEMP/generated/ci-check-ui" --template . --title "CI Check" --skip-install --skip-git --yes

      - name: Install generated project dependencies
        working-directory: ${{ runner.temp }}/generated/ci-check-ui
        run: pnpm install

      - name: Format the generated project
        working-directory: ${{ runner.temp }}/generated/ci-check-ui
        run: pnpm run format

      - name: Check the generated project (format, lint, tests, build)
        working-directory: ${{ runner.temp }}/generated/ci-check-ui
        run: |
          pnpm run format:check
          pnpm run lint
          pnpm run test:coverage
          pnpm run build
          pnpm run build-storybook

      - name: Check that no starter text leaks into the generated project
        working-directory: ${{ runner.temp }}/generated/ci-check-ui
        run: |
          if grep -rn "angular-starter-ui/" . --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=storybook-static --exclude-dir=.angular --exclude=pnpm-lock.yaml --exclude=.starter-manifest.json; then
            echo "::error::A path of the starter library name survived generation"
            exit 1
          fi
          if grep -in "starter" AGENTS.md projects/ui/README.md; then
            echo "::error::Starter wording leaked into a generated document"
            exit 1
          fi
